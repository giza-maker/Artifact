<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f8f3e9" />
    <title>Nomli | Your everyday kitchen</title>
    <meta
      name="description"
      content="Nomli: scan ingredients, cook with Zara, and review Arabic or English voice transcripts before sending."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      as="font"
      href="/fonts/dm-sans.woff2"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./app.css" />
    <link rel="stylesheet" href="./mobile-select.css" />
    <link rel="stylesheet" href="./mobile-polish.css" />
    <script type="module" src="./main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to app content</a>
    <div class="app-device">
      <main class="app-scroll" id="main">
        <header class="app-topbar">
          <a class="brand-word" href="#kitchen" aria-label="Nomli kitchen"
            ><img src="/favicon.svg" alt="" width="26" height="26" />Nomli</a
          >
          <div class="topbar-actions">
            <button
              class="icononly"
              data-action="menu"
              aria-label="Open app menu"
            >
              <svg class="ui-icon" aria-hidden="true">
                <use href="/icons.svg#list" />
              </svg>
            </button>
          </div>
        </header>
        <div class="app-content">
          <div id="draft-recovery" hidden></div>
          <div id="view" tabindex="-1" aria-busy="true">
            <section class="card" role="status">
              <h1>Loading local inventory.</h1>
              <p>
                Reading data stored on this device. Existing data is never
                replaced automatically when loading fails.
              </p>
            </section>
          </div>
          <footer class="app-footer">
            Inventory is stored locally. Scans use your protected endpoint and
            never save until reviewed. Zara sends kitchen context only when you
            ask.
            <button class="text-link" data-action="reset-ask">
              Clear local data
            </button>
          </footer>
        </div>
      </main>
      <div class="app-bottom">
        <div id="kitchen-intake-dock" class="kitchen-intake-dock" hidden>
          <button
            type="button"
            class="btn btn-primary"
            data-action="go"
            data-id="scan"
          >
            <svg class="ui-icon" aria-hidden="true">
              <use href="/icons.svg#plus" /></svg
            ><span>Add groceries</span>
          </button>
        </div>
        <nav
          class="bottom-nav"
          id="bottom-nav"
          aria-label="Main app navigation"
        ></nav>
      </div>
    </div>
    <dialog id="modal" aria-labelledby="modal-title">
      <div id="modal-content"></div>
    </dialog>
    <dialog
      id="cooking-chat-panel"
      data-mode="cooking"
      aria-labelledby="cooking-chat-title"
    ></dialog>
    <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>
    <div id="toast" class="toast" role="status" hidden></div>
    <noscript><p>Enable JavaScript to open Nomli.</p></noscript>
  </body>
</html>
