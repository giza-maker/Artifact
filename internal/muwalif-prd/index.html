<script>const form = document.querySelector('#unlock');
const input = document.querySelector('#access-key');
const submit = form.querySelector('button');
const status = document.querySelector('#status');
const gate = document.querySelector('#gate');
const toolbar = document.querySelector('#toolbar');
const opened = document.querySelector('#opened');

function bytes(value) {
  return Uint8Array.from(atob(value), character => character.charCodeAt(0));
}

form.addEventListener('submit', async event => {
  event.preventDefault();
  if (submit.disabled) return;
  if (!globalThis.isSecureContext || !globalThis.crypto?.subtle || !globalThis.DecompressionStream) {
    status.textContent = 'افتح الرابط في متصفح حديث عبر HTTPS. Use a current browser over HTTPS.';
    return;
  }
  submit.disabled = true;
  input.removeAttribute('aria-invalid');
  status.textContent = '';
  let frame;
  try {
    const payload = JSON.parse(document.querySelector('#encrypted').textContent);
    const accessKey = new TextEncoder().encode(input.value.trim());
    input.value = '';
    let material;
    try {
      material = await crypto.subtle.importKey('raw', accessKey, 'PBKDF2', false, ['deriveKey']);
    } finally {
      accessKey.fill(0);
    }
    const key = await crypto.subtle.deriveKey({
      name: 'PBKDF2', hash: 'SHA-256', salt: bytes(payload.salt), iterations: payload.iterations
    }, material, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const compressed = await crypto.subtle.decrypt({
      name: 'AES-GCM', iv: bytes(payload.iv), tagLength: 128
    }, key, bytes(payload.ciphertext));
    const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const content = await new Response(stream).text();
    frame = document.createElement('iframe');
    frame.title = 'موالف · Team specification';
    frame.setAttribute('sandbox','allow-scripts allow-downloads allow-modals');
    frame.srcdoc = content;
    opened.replaceChildren(frame);
    gate.hidden = true;
    toolbar.hidden = false;
    opened.hidden = false;
    document.querySelector('#lock').focus();
  } catch {
    status.textContent = 'تعذّر الفتح. تحقق من المفتاح. Unable to unlock. Check the key.';
    input.setAttribute('aria-invalid','true');
    input.focus();
  } finally {
    submit.disabled = false;
  }
});

document.querySelector('#lock').addEventListener('click', () => {
  opened.replaceChildren();
  opened.hidden = true;
  toolbar.hidden = true;
  gate.hidden = false;
  status.textContent = '';
  input.value = '';
  input.focus();
});

window.addEventListener('pagehide', () => {
  if (!gate.hidden) return;
  document.querySelector('#lock').click();
});</script>
