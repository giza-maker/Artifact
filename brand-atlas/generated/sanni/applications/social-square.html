<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanni / social-square</title><style>@import url('../fonts.css');:root{--primary:#174C3C;--accent:#A6753D;--accent-text:#161A14;--paper:#F7F3E8;--ink:#183A31}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper)}h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}p{line-height:1.65}a{color:inherit}img{max-width:100%;display:block}.ar,[lang=ar]{font-family:'Noto Sans Arabic',sans-serif;line-height:1.9}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:5px}.label{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.logo{object-fit:contain}.pair{display:grid;grid-template-columns:1fr 1fr;gap:40px}.pair p{font-size:15px}.pair p[lang=ar]{text-align:right}.rule{height:1px;background:var(--ink);opacity:.2}.accent{background:var(--accent)}body{width:1080px;height:1080px;overflow:hidden}body{background:var(--paper)}main{height:100%;padding:80px;position:relative;overflow:hidden;border:25px solid var(--accent)}h1{font-size:100px;line-height:1.02;letter-spacing:-6px;max-width:800px;margin-top:100px}main>p.ar{font-size:40px;margin-top:35px;text-align:left}.social-logo{position:absolute;bottom:60px;left:75px}.logo{width:350px;height:190px}.line-mark{position:absolute;bottom:90px;right:80px;width:200px;height:13px;background:var(--accent);transform:rotate(-40deg)}.closing{color:var(--accent-text)}.approach{color:#FFFEFA}.approach>div>p,.pillars span{opacity:1}</style></head><body><main><span class="label">Sanni / سنّع</span><h1>Put work in order.</h1><p class="ar" lang="ar" dir="rtl">سنّع شغلك.</p><div class="social-logo"><img class="logo" src="../logo.png" alt="Sanni bilingual generated logo"></div><span class="line-mark"></span></main></body></html>
