<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanni / presentation-cover</title><style>@import url('../fonts.css');:root{--primary:#174C3C;--accent:#A6753D;--accent-text:#161A14;--paper:#F7F3E8;--ink:#183A31}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper)}h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}p{line-height:1.65}a{color:inherit}img{max-width:100%;display:block}.ar,[lang=ar]{font-family:'Noto Sans Arabic',sans-serif;line-height:1.9}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:5px}.label{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.logo{object-fit:contain}.pair{display:grid;grid-template-columns:1fr 1fr;gap:40px}.pair p{font-size:15px}.pair p[lang=ar]{text-align:right}.rule{height:1px;background:var(--ink);opacity:.2}.accent{background:var(--accent)}body{width:1200px;height:800px;overflow:hidden}body{display:flex;align-items:center;justify-content:center;background:#dddcd2}main{width:1080px;height:650px;background:var(--paper);border-left:22px solid var(--accent);padding:47px 55px;position:relative}.logo{width:190px;height:90px;margin-bottom:38px}h1{font-size:60px;line-height:1.05;letter-spacing:-2.8px;max-width:760px;margin-block:20px}.tag{display:flex;align-items:center;gap:35px;font-size:13px;margin-top:32px}.tag .ar{font-size:14px}footer{display:flex;gap:17px;align-items:center;border-top:1px solid #8884;position:absolute;bottom:28px;left:55px;right:55px;padding-top:17px;font-size:12px}footer>span:last-child{margin-left:auto;font-size:10px}.closing{color:var(--accent-text)}.approach{color:#FFFEFA}.approach>div>p,.pillars span{opacity:1}</style></head><body><main><img class="logo" src="../logo.png" alt="Sanni bilingual generated logo"><span class="label">Technology & intelligence</span><h1>Put every moving part in its place</h1><div class="tag"><p>Put work in order.</p><p class="ar" lang="ar" dir="rtl">سنّع شغلك.</p></div><footer>Sanni <span class="ar" lang="ar" dir="rtl">سنّع</span><span>Brand introduction</span></footer></main></body></html>
