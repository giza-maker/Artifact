<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sanni / social-banner</title><style>@import url('../fonts.css');:root{--primary:#174C3C;--accent:#A6753D;--accent-text:#161A14;--paper:#F7F3E8;--ink:#183A31}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper)}h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}p{line-height:1.65}a{color:inherit}img{max-width:100%;display:block}.ar,[lang=ar]{font-family:'Noto Sans Arabic',sans-serif;line-height:1.9}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:5px}.label{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.logo{object-fit:contain}.pair{display:grid;grid-template-columns:1fr 1fr;gap:40px}.pair p{font-size:15px}.pair p[lang=ar]{text-align:right}.rule{height:1px;background:var(--ink);opacity:.2}.accent{background:var(--accent)}body{width:1200px;height:800px;overflow:hidden}body{display:flex;align-items:center;background:#deddd5}main{width:100%;height:450px;background:var(--paper);border-block:18px solid var(--accent);padding:55px 80px;display:grid;grid-template-columns:1fr 1.2fr;gap:50px;align-items:center}.logo{width:360px;height:220px}main>div+div{border-left:1px solid #8885;padding-left:50px}h1{font-size:56px;line-height:1.1;letter-spacing:-2px}.ar{font-size:25px;margin-top:25px;text-align:left}.closing{color:var(--accent-text)}.approach{color:#FFFEFA}.approach>div>p,.pillars span{opacity:1}</style></head><body><main><div><img class="logo" src="../logo.png" alt="Sanni bilingual generated logo"></div><div><h1>Put work in order.</h1><p class="ar" lang="ar" dir="rtl">سنّع شغلك.</p></div></main></body></html>
