<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tafrah / signage</title><style>@import url('../fonts.css');:root{--primary:#2443D8;--accent:#FA6A5D;--accent-text:#161A14;--paper:#F1F7FF;--ink:#15255E}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper)}h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}p{line-height:1.65}a{color:inherit}img{max-width:100%;display:block}.ar,[lang=ar]{font-family:'Noto Sans Arabic',sans-serif;line-height:1.9}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:5px}.label{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.logo{object-fit:contain}.pair{display:grid;grid-template-columns:1fr 1fr;gap:40px}.pair p{font-size:15px}.pair p[lang=ar]{text-align:right}.rule{height:1px;background:var(--ink);opacity:.2}.accent{background:var(--accent)}body{width:1200px;height:800px;overflow:hidden}body{background:#dedbd0}.wall{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(110deg,#d0cdbf,#f2f0e7 48%,#d9d7cb)}.sign{background:var(--paper);width:860px;padding:45px 65px;border-left:12px solid var(--accent);box-shadow:12px 17px 25px #0002;transform:perspective(1200px) rotateY(-8deg)}.logo{width:540px;height:270px;margin:auto}.tag{display:flex;justify-content:center;align-items:center;gap:30px;border-top:1px solid #8884;padding-top:20px;font-size:16px}.tag .ar{font-size:17px}.floor{position:absolute;bottom:0;left:0;right:0;height:50px;background:#bbb8aa;border-top:4px solid #c9c6ba}.closing{color:var(--accent-text)}.approach{color:#FFFEFA}.approach>div>p,.pillars span{opacity:1}</style></head><body><div class="wall"><div class="sign"><img class="logo" src="../logo.png" alt="Tafrah bilingual generated logo"><div><div class="tag"><p>Make the leap.</p><p class="ar" lang="ar" dir="rtl">من فكرة إلى طفرة.</p></div></div></div><span class="floor"></span></div></body></html>
