<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tafrah / business-card</title><style>@import url('../fonts.css');:root{--primary:#2443D8;--accent:#FA6A5D;--accent-text:#161A14;--paper:#F1F7FF;--ink:#15255E}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;color:var(--ink);background:var(--paper)}h1,h2,h3,p{margin:0}h1,h2,h3{text-wrap:balance}p{line-height:1.65}a{color:inherit}img{max-width:100%;display:block}.ar,[lang=ar]{font-family:'Noto Sans Arabic',sans-serif;line-height:1.9}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:5px}.label{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.logo{object-fit:contain}.pair{display:grid;grid-template-columns:1fr 1fr;gap:40px}.pair p{font-size:15px}.pair p[lang=ar]{text-align:right}.rule{height:1px;background:var(--ink);opacity:.2}.accent{background:var(--accent)}body{width:1200px;height:800px;overflow:hidden}body{background:#e3e0d6;display:flex;align-items:center;justify-content:center;gap:36px}.back,.front{width:470px;height:280px;background:var(--paper);padding:36px;position:relative;box-shadow:0 20px 28px #0001}.back{transform:rotate(-5deg);display:flex;align-items:center;justify-content:center;border-bottom:8px solid var(--accent)}.back .logo{width:290px;height:160px}.front{transform:rotate(4deg)}.front .logo{width:170px;height:80px}.person{margin-top:20px;display:flex;flex-direction:column;gap:5px;font-size:12px}.person strong{font-size:17px}.contact{font-size:11px;line-height:1.7;margin-top:13px}.closing{color:var(--accent-text)}.approach{color:#FFFEFA}.approach>div>p,.pillars span{opacity:1}</style></head><body><div class="back"><img class="logo" src="../logo.png" alt="Tafrah bilingual generated logo"><span class="edge"></span></div><div class="front"><img class="logo" src="../logo.png" alt="Tafrah bilingual generated logo"><div class="person"><strong>Business Development</strong><span>Let’s build something useful.</span></div><div class="contact">hello@tafrah.example<br />tafrah.example</div></div></body></html>
