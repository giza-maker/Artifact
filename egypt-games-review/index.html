  <style>
    /* Warm Daylight Studio Palette */
    .studio-canvas {
      --s-bg: #FAF7F2;
      --s-surface: #FFFFFF;
      --s-sand: #F3EFE7;
      --s-sand-hover: #ECE6DA;
      --s-border: #E5DECFE6;
      --s-border-strong: #D5CCB8;
      --s-ink: #25282A;
      --s-muted: #625D55;
      --s-subtle: #8A8378;
      --s-teal: #2A6B5E;
      --s-teal-soft: #EBF4F1;
      --s-terra: #C05239;
      --s-terra-soft: #FDF0EC;
      --s-ochre: #BA7725;
      --s-ochre-soft: #FDF5E8;
      --s-slate: #356685;
      --s-slate-soft: #EDF4F8;

      background-color: var(--s-bg);
      color: var(--s-ink);
      font-family: "Plus Jakarta Sans", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, -apple-system, sans-serif;
    }

    html[dir="rtl"] .studio-canvas {
      font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
    }

    .font-editorial {
      font-family: "Newsreader", "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
      letter-spacing: -0.018em;
    }
    html[dir="rtl"] .font-editorial {
      font-family: "Amiri", "IBM Plex Sans Arabic", Georgia, serif;
      letter-spacing: 0;
      line-height: 1.32;
    }

    /* Logical directional borders so LTR & RTL mirror automatically */
    .line-t { border-top: 1px solid var(--s-border); }
    .line-b { border-bottom: 1px solid var(--s-border); }
    .line-is { border-inline-start: 1px solid var(--s-border); }
    .line-ie { border-inline-end: 1px solid var(--s-border); }
    @media (min-width: 640px) {
      .sm-line-ie { border-inline-end: 1px solid var(--s-border); }
    }
    @media (min-width: 1024px) {
      .lg-line-ie { border-inline-end: 1px solid var(--s-border); }
    }

    .card-warm {
      background-color: var(--s-surface);
      border: 1px solid var(--s-border);
      box-shadow: 0 1px 3px rgba(60, 50, 35, 0.035);
    }
    .card-sand {
      background-color: var(--s-sand);
      border: 1px solid var(--s-border);
    }

    /* Reading progress hairline — mirrors origin in RTL */
    #scrollProgress {
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 80ms linear;
      background: linear-gradient(90deg, var(--s-teal), var(--s-ochre), var(--s-terra));
    }
    html[dir="rtl"] #scrollProgress {
      transform-origin: right center;
      background: linear-gradient(270deg, var(--s-teal), var(--s-ochre), var(--s-terra));
    }

    /* Language crossfade */
    #pageRoot {
      transition: opacity 200ms ease, transform 200ms ease;
    }
    #pageRoot.lang-switching {
      opacity: 0;
      transform: translateY(4px);
    }

    /* Sunlit photographic frames */
    .photo-frame {
      overflow: hidden;
      border-radius: 8px;
      border: 1px solid var(--s-border-strong);
      background-color: var(--s-sand);
    }
    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.04);
      transition: transform 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .photo-frame.in-view .photo-img {
      transform: scale(1);
    }
    .photo-frame:hover .photo-img {
      transform: scale(1.018);
    }

    /* Choreographed scroll reveals */
    .reveal {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 720ms cubic-bezier(0.16, 1, 0.3, 1), transform 720ms cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .reveal.in-view {
      opacity: 1;
      transform: translateY(0);
    }
    .delay-1 { transition-delay: 85ms; }
    .delay-2 { transition-delay: 170ms; }

    /* Gliding indicators explicitly anchored left:0 for pixel-accurate LTR & RTL positioning */
    #navIndicator {
      position: absolute;
      left: 0;
      bottom: -1px;
      height: 2px;
      background-color: var(--s-teal);
      transition: transform 380ms cubic-bezier(0.22, 1, 0.36, 1), width 380ms cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    #dossierIndicator {
      position: absolute;
      left: 0;
      bottom: -1px;
      height: 2.5px;
      background-color: var(--s-teal);
      transition: transform 360ms cubic-bezier(0.22, 1, 0.36, 1), width 360ms cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    /* Product dossier crossfade + gentle blur transition */
    .dossier-stage {
      transition: opacity 250ms cubic-bezier(0.22, 1, 0.36, 1), transform 250ms cubic-bezier(0.22, 1, 0.36, 1), filter 250ms ease;
    }
    .dossier-stage.switching {
      opacity: 0;
      transform: translateY(8px);
      filter: blur(3px);
    }

    /* Forensic exhibit crossfade */
    .exhibit-fade {
      transition: opacity 300ms cubic-bezier(0.22, 1, 0.36, 1), transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .exhibit-fade.fade-out {
      opacity: 0;
      transform: scale(0.988);
    }

    /* Animated score bars */
    .score-fill {
      width: 0%;
      transition: width 1050ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Smooth CSS grid accordion */
    .audit-drawer {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 340ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .audit-row.open .audit-drawer {
      grid-template-rows: 1fr;
    }
    .audit-drawer-inner {
      overflow: hidden;
    }
    .audit-chevron {
      transition: transform 300ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .audit-row.open .audit-chevron {
      transform: rotate(180deg);
    }

    /* Warm Accent Pills & Logical Inline-Start Rules */
    .pill-terra {
      color: var(--s-terra);
      background-color: var(--s-terra-soft);
      border: 1px solid #EDC7BD;
    }
    .pill-ochre {
      color: var(--s-ochre);
      background-color: var(--s-ochre-soft);
      border: 1px solid #ECD7B4;
    }
    .pill-teal {
      color: var(--s-teal);
      background-color: var(--s-teal-soft);
      border: 1px solid #BFDDD6;
    }
    .pill-slate {
      color: var(--s-slate);
      background-color: var(--s-slate-soft);
      border: 1px solid #C4D9E6;
    }

    .accent-is-terra { border-inline-start: 3px solid var(--s-terra); }
    .accent-is-ochre { border-inline-start: 3px solid var(--s-ochre); }
    .accent-is-teal  { border-inline-start: 3px solid var(--s-teal); }
    .ps-inline-3 { padding-inline-start: 0.75rem; }

    .btn-studio-active {
      background-color: var(--s-teal);
      color: #FFFFFF;
      border: 1px solid var(--s-teal);
    }
    .btn-studio-idle {
      background-color: var(--s-surface);
      color: var(--s-muted);
      border: 1px solid var(--s-border-strong);
    }
    .btn-studio-idle:hover {
      background-color: var(--s-sand);
      color: var(--s-ink);
    }

    .lang-pill-active {
      background-color: var(--s-teal);
      color: #FFFFFF;
    }
    .lang-pill-idle {
      color: var(--s-muted);
    }
    .lang-pill-idle:hover {
      color: var(--s-ink);
    }

    .ltr-token {
      direction: ltr;
      unicode-bidi: isolate;
      display: inline-block;
    }
    .rtl-specimen {
      direction: rtl;
      unicode-bidi: isolate;
    }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .photo-img, .dossier-stage, .exhibit-fade, .score-fill, .audit-drawer, #navIndicator, #dossierIndicator, #pageRoot {
        transition: none !important;
        transform: none !important;
        opacity: 1 !important;
      }
    }

    @media print {
      .no-print { display: none !important; }
      .reveal { opacity: 1 !important; transform: none !important; }
      .audit-drawer { grid-template-rows: 1fr !important; }
    }
  </style>
</head>

    let currentLang = "en";
    let currentExhibitIdx = 0;
    let activeDossierKey = "ms";
    const specimenModes = {};

    function setLanguage(lang, skipAnim = false) {
      if (lang !== "en" && lang !== "ar") lang = "en";
      const root = document.getElementById("pageRoot");
      const apply = () => {
        currentLang = lang;
        const htmlEl = document.documentElement;
        htmlEl.setAttribute("lang", lang);
        htmlEl.setAttribute("dir", lang === "ar" ? "rtl" : "ltr");

        try {
          const url = new URL(window.location.href);
          if (lang === "ar") url.searchParams.set("lang", "ar");
          else url.searchParams.delete("lang");
          window.history.replaceState({}, "", url.toString());
        } catch (_) {}

        document.getElementById("langBtnEn").className = `px-2.5 py-1 rounded text-xs font-semibold transition cursor-pointer ${lang === "en" ? "lang-pill-active" : "lang-pill-idle"}`;
        document.getElementById("langBtnAr").className = `px-2.5 py-1 rounded text-xs font-semibold transition cursor-pointer ${lang === "ar" ? "lang-pill-active" : "lang-pill-idle"}`;

        renderAllLocaleContent();
        requestAnimationFrame(() => {
          const activeNav = document.querySelector(".chapter-link.font-semibold") || document.getElementById("nav01");
          updateNavIndicator(activeNav);
          const activeDosBtn = document.querySelector(`.dossier-btn[data-key="${activeDossierKey}"]`);
          updateDossierIndicator(activeDosBtn);
        });
      };

      if (skipAnim) {
        apply();
        return;
      }
      root.classList.add("lang-switching");
      setTimeout(() => {
        apply();
        root.classList.remove("lang-switching");
      }, 170);
    }

    function renderAllLocaleContent() {
      const L = I18N[currentLang];
      document.title = L.pageTitle;
      document.getElementById("hdrBrandTitle").textContent = L.hdrBrandTitle;
      document.getElementById("hdrPreparedFor").textContent = L.hdrPreparedFor;
      document.getElementById("hdrPrintBtn").textContent = L.hdrPrintBtn;

      L.nav.forEach((txt, idx) => {
        document.getElementById(`nav0${idx + 1}`).textContent = txt;
      });

      document.getElementById("heroBadge").innerHTML = L.heroBadge;
      document.getElementById("heroTitle").textContent = L.heroTitle;
      document.getElementById("heroDesc").innerHTML = L.heroDesc;
      document.getElementById("heroBtnPrimary").textContent = L.heroBtnPrimary;
      document.getElementById("heroBtnSecondary").textContent = L.heroBtnSecondary;
      document.getElementById("heroCaptionLeft").textContent = L.heroCaptionLeft;
      document.getElementById("heroCaptionRight").textContent = L.heroCaptionRight;

      L.kpis.forEach((k, i) => {
        const n = i + 1;
        document.getElementById(`kpi${n}Label`).textContent = k.label;
        document.getElementById(`kpi${n}Unit`).textContent = k.unit;
        document.getElementById(`kpi${n}Sub`).textContent = k.sub;
      });

      document.getElementById("sec01Kicker").textContent = L.sec01Kicker;
      document.getElementById("sec01Title").textContent = L.sec01Title;
      document.getElementById("sec01Sub").textContent = L.sec01Sub;
      document.getElementById("partnerLetterBody").innerHTML = L.partnerLetterHtml;

      document.getElementById("sec02Kicker").textContent = L.sec02Kicker;
      document.getElementById("sec02Title").textContent = L.sec02Title;
      document.getElementById("sec02Sub").textContent = L.sec02Sub;
      document.getElementById("radarHeaderLeft").textContent = L.radarHeaderLeft;
      document.getElementById("radarHeaderRight").textContent = L.radarHeaderRight;
      document.getElementById("radarLegendCurrent").textContent = L.radarLegendCurrent;
      document.getElementById("radarLegendTarget").textContent = L.radarLegendTarget;

      renderScorecard(true);
      renderRadar();

      document.getElementById("sec03Kicker").textContent = L.sec03Kicker;
      document.getElementById("sec03Title").innerHTML = L.sec03TitleHtml;
      document.getElementById("sec03Sub").textContent = L.sec03Sub;
      document.getElementById("exhibitBarTitle").textContent = L.exhibitBarTitle;
      document.getElementById("exBtn0").innerHTML = L.exBtn0Html;
      document.getElementById("exBtn1").innerHTML = L.exBtn1Html;
      document.getElementById("exhibitFixLabel").textContent = L.exhibitFixLabel;
      populateExhibitImmediate(currentExhibitIdx);

      document.getElementById("webCardsGrid").innerHTML = L.webCards.map(c => `
        <div class="card-warm rounded-lg p-5 ${c.cls} space-y-2">
          <div class="text-xs font-semibold" style="color: ${c.color};">${c.title}</div>
          <p class="text-xs leading-relaxed" style="color: var(--s-muted);">${c.body}</p>
        </div>
      `).join("");

      document.getElementById("sec04Kicker").textContent = L.sec04Kicker;
      document.getElementById("sec04Title").textContent = L.sec04Title;
      document.getElementById("sec04Sub").textContent = L.sec04Sub;

      ["ms", "rb", "ak", "bd"].forEach(k => {
        const btn = document.querySelector(`.dossier-btn[data-key="${k}"]`);
        const t = L.dossierTabs[k];
        btn.innerHTML = `
          <div class="text-xs font-semibold" style="color: ${t.color};">${t.kicker}</div>
          <div class="font-editorial text-lg mt-0.5" style="color: var(--s-ink);">${t.name}</div>
          <div class="text-xs mt-0.5" style="color: var(--s-subtle);">${t.sub}</div>
        `;
      });
      renderDossierContent(activeDossierKey);

      document.getElementById("sec05Kicker").textContent = L.sec05Kicker;
      document.getElementById("sec05Title").textContent = L.sec05Title;
      document.getElementById("sec05Sub").textContent = L.sec05Sub;
      document.getElementById("regSearch").placeholder = L.searchPlaceholder;

      const prevP = document.getElementById("regPractice").value || "ALL";
      const prevC = document.getElementById("regClass").value || "ALL";
      document.getElementById("regPractice").innerHTML = L.practiceOptions.map(o => `<option value="${o.val}">${o.label}</option>`).join("");
      document.getElementById("regClass").innerHTML = L.classOptions.map(o => `<option value="${o.val}">${o.label}</option>`).join("");
      document.getElementById("regPractice").value = prevP;
      document.getElementById("regClass").value = prevC;
      renderRegister();

      document.getElementById("sec06Kicker").textContent = L.sec06Kicker;
      document.getElementById("sec06Title").textContent = L.sec06Title;
      document.getElementById("sec06Sub").textContent = L.sec06Sub;
      document.getElementById("triageCards").innerHTML = L.triageHtml;
      document.getElementById("timelineGrid").innerHTML = L.timelineHtml;
      document.getElementById("closingBanner").innerHTML = L.closingHtml;
    }

    function renderScorecard(immediate = false) {
      const L = I18N[currentLang];
      const arrow = currentLang === "ar" ? "←" : "→";
      const container = document.getElementById("scorecardRows");
      const alreadyVisible = container.classList.contains("in-view") || immediate;
      container.innerHTML = L.practices.map(p => {
        const pct = Math.round((p.score / 10) * 100);
        const targetPct = Math.round((p.target / 10) * 100);
        const barColor = p.score <= 2.0 ? "var(--s-terra)" : "var(--s-ochre)";
        return `
          <div class="py-3.5 first:pt-0 last:pb-0 space-y-1.5">
            <div class="flex flex-wrap items-baseline justify-between gap-2">
              <div class="flex items-baseline gap-2.5">
                <span class="font-mono text-xs" style="color: var(--s-subtle);">${p.code}</span>
                <h3 class="font-editorial text-lg" style="color: var(--s-ink);">${p.name}</h3>
              </div>
              <div class="font-mono text-xs tabular-nums">
                <span class="font-bold" style="color:${barColor}">${p.score.toFixed(1)}</span>
                <span style="color: var(--s-subtle);"> / 10 ${arrow} ${L.targetWord} ${p.target.toFixed(1)}</span>
              </div>
            </div>
            <div class="relative h-2 w-full rounded-full overflow-hidden" style="background-color: var(--s-sand);">
              <div class="absolute inset-y-0 start-0 rounded-full opacity-25" style="width:${targetPct}%; background:var(--s-teal)"></div>
              <div class="score-fill relative h-full rounded-full" data-width="${pct}%" style="width:${alreadyVisible ? pct + '%' : '0%'}; background:${barColor}"></div>
            </div>
            <p class="text-xs leading-relaxed" style="color: var(--s-muted);">${p.summary}</p>
          </div>
        `;
      }).join("");
    }

    function renderRadar() {
      const L = I18N[currentLang];
      const svg = document.getElementById("warmRadar");
      const cx = 160, cy = 148, maxR = 94;
      const n = L.practices.length;
      const angle = i => (-Math.PI / 2) + (i * 2 * Math.PI / n);
      const point = (i, val) => {
        const r = (val / 10) * maxR;
        const a = angle(i);
        return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      };

      let rings = "";
      [2.5, 5, 7.5, 10].forEach(lvl => {
        const pts = L.practices.map((_, i) => point(i, lvl).join(",")).join(" ");
        rings += `<polygon points="${pts}" fill="none" stroke="#E2DACB" stroke-width="1" />`;
      });

      let spokes = "";
      let labels = "";
      L.practices.forEach((p, i) => {
        const [x, y] = point(i, 10);
        spokes += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#E2DACB" stroke-width="1" />`;
        const [lx, ly] = point(i, 12.3);
        const anchor = Math.abs(lx - cx) < 14 ? "middle" : (lx > cx ? "start" : "end");
        labels += `<text x="${lx}" y="${ly + 3}" text-anchor="${anchor}" fill="#625D55" font-size="11" font-weight="600">${p.short}</text>`;
      });

      const targetPoly = L.practices.map((p, i) => point(i, p.target).join(",")).join(" ");
      const currentPoly = L.practices.map((p, i) => point(i, p.score).join(",")).join(" ");
      const vertices = L.practices.map((p, i) => {
        const [x, y] = point(i, p.score);
        return `<circle cx="${x}" cy="${y}" r="3.5" fill="#BA7725" />`;
      }).join("");

      svg.innerHTML = `
        ${rings}
        ${spokes}
        <polygon points="${targetPoly}" fill="rgba(42, 107, 94, 0.11)" stroke="#2A6B5E" stroke-width="1.5" stroke-dasharray="4 3" />
        <polygon points="${currentPoly}" fill="rgba(186, 119, 37, 0.22)" stroke="#BA7725" stroke-width="2" />
        ${vertices}
        ${labels}
      `;
    }

    function populateExhibitImmediate(idx) {
      const ex = I18N[currentLang].exhibits[idx];
      document.getElementById("exBtn0").className = idx === 0
        ? "px-3 py-1.5 rounded-md text-xs font-medium btn-studio-active transition cursor-pointer"
        : "px-3 py-1.5 rounded-md text-xs font-medium btn-studio-idle transition cursor-pointer";
      document.getElementById("exBtn1").className = idx === 1
        ? "px-3 py-1.5 rounded-md text-xs font-medium btn-studio-active transition cursor-pointer"
        : "px-3 py-1.5 rounded-md text-xs font-medium btn-studio-idle transition cursor-pointer";

      document.getElementById("exhibitImg").src = ex.img;
      const tagEl = document.getElementById("exhibitTag");
      tagEl.textContent = ex.tag;
      tagEl.className = `inline-block px-2.5 py-0.5 rounded text-xs font-medium ${ex.tagClass}`;
      document.getElementById("exhibitTitle").textContent = ex.title;
      document.getElementById("exhibitDesc").textContent = ex.desc;
      document.getElementById("exhibitFix").textContent = ex.fix;
    }

    function switchExhibit(idx) {
      currentExhibitIdx = idx;
      const stage = document.getElementById("exhibitStage");
      stage.classList.add("fade-out");
      setTimeout(() => {
        populateExhibitImmediate(idx);
        stage.classList.remove("fade-out");
      }, 200);
    }

    function updateDossierIndicator(btn) {
      const ind = document.getElementById("dossierIndicator");
      if (!ind || !btn) return;
      ind.style.width = `${btn.offsetWidth}px`;
      ind.style.transform = `translateX(${btn.offsetLeft}px)`;
    }

    function renderDossierContent(key) {
      const L = I18N[currentLang];
      const d = L.dossiers[key];
      const stage = document.getElementById("dossierStage");

      const specsHtml = d.specimens.map((s, idx) => {
        const stateKey = `${key}-${idx}`;
        const showClean = !!specimenModes[stateKey];
        const valText = showClean ? s.standard : s.defect;
        const hasArabic = /[\u0600-\u06FF]/.test(valText);
        return `
          <div class="card-sand rounded-lg p-4 flex flex-col justify-between space-y-3">
            <div class="flex items-center justify-between gap-2 line-b pb-2">
              <span class="text-xs font-semibold" style="color: var(--s-ink);">${s.label}</span>
              <button onclick="toggleSpecimen('${stateKey}')" class="px-2.5 py-1 rounded text-xs font-medium bg-white border border-[#D5CCB8] hover:bg-[#FAF7F2] transition cursor-pointer whitespace-nowrap" style="color: var(--s-teal);">
                ${showClean ? L.specimenBtnSeeCurrent : L.specimenBtnSeeClean}
              </button>
            </div>
            <div class="p-3 rounded bg-white border border-[#E5DECF] ${showClean ? 'accent-is-teal' : 'accent-is-terra'} transition-all">
              <div class="text-xs font-semibold mb-1" style="color: ${showClean ? 'var(--s-teal)' : 'var(--s-terra)'};">
                ${showClean ? L.specimenStateClean : L.specimenStateCurrent}
              </div>
              <div class="text-xs font-semibold leading-relaxed ${hasArabic ? 'rtl-specimen text-sm' : 'font-mono ltr-token'}" style="color: var(--s-ink);">
                ${valText}
              </div>
            </div>
            <p class="text-xs leading-relaxed" style="color: var(--s-muted);">${s.note}</p>
          </div>
        `;
      }).join("");

      const colsHtml = d.columns.map(c => `
        <div class="space-y-2.5">
          <h4 class="text-xs font-semibold uppercase tracking-wider line-b pb-2" style="color: var(--s-ink);">${c.heading}</h4>
          <ul class="space-y-2 text-xs leading-relaxed" style="color: var(--s-muted);">
            ${c.items.map(it => `<li class="ps-inline-3 line-is">${it}</li>`).join("")}
          </ul>
        </div>
      `).join("");

      stage.innerHTML = `
        <div class="space-y-6">
          <div class="space-y-1.5 line-b pb-5">
            <span class="inline-block px-3 py-0.5 rounded-full text-xs font-semibold ${d.badgeClass}">${d.badge}</span>
            <h3 class="font-editorial text-2xl sm:text-3xl pt-1" style="color: var(--s-ink);">${d.title}</h3>
            <div class="text-xs" style="color: var(--s-subtle);">${d.meta}</div>
          </div>

          <p class="text-sm leading-relaxed max-w-4xl" style="color: var(--s-muted);">${d.opinion}</p>

          <div class="space-y-3">
            <div class="text-xs font-semibold uppercase tracking-wider" style="color: var(--s-teal);">${d.specimensTitle}</div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">${specsHtml}</div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">${colsHtml}</div>
        </div>
      `;
    }

    function selectDossier(key, btnEl) {
      activeDossierKey = key;
      document.querySelectorAll(".dossier-btn").forEach(b => {
        const active = b === btnEl;
        b.classList.toggle("bg-white", active);
        b.classList.toggle("opacity-75", !active);
      });
      updateDossierIndicator(btnEl);

      const stage = document.getElementById("dossierStage");
      stage.classList.add("switching");
      setTimeout(() => {
        renderDossierContent(key);
        stage.classList.remove("switching");
      }, 190);
    }

    function toggleSpecimen(stateKey) {
      specimenModes[stateKey] = !specimenModes[stateKey];
      renderDossierContent(activeDossierKey);
    }

    function renderRegister() {
      const L = I18N[currentLang];
      const q = (document.getElementById("regSearch").value || "").toLowerCase().trim();
      const prac = document.getElementById("regPractice").value;
      const cls = document.getElementById("regClass").value;

      const filtered = REGISTER_ITEMS.filter(item => {
        const t = item[currentLang];
        const okP = prac === "ALL" || item.pKey === prac;
        const okC = cls === "ALL" || item.cls === cls;
        const okQ = !q || [item.code, L.practiceLabels[item.pKey], t.asset, t.loc, t.title, t.detail, item.en.title, item.en.asset].join(" ").toLowerCase().includes(q);
        return okP && okC && okQ;
      });

      document.getElementById("registerCounter").textContent = L.showingCounter(filtered.length, REGISTER_ITEMS.length);

      const list = document.getElementById("registerList");
      if (!filtered.length) {
        list.innerHTML = `<div class="p-8 text-center text-xs" style="color: var(--s-muted);">${L.emptyFilterMsg}</div>`;
        return;
      }

      list.innerHTML = filtered.map(item => {
        const t = item[currentLang];
        const pillText = L.pillLabels[item.cls];
        const pillCls = item.cls === "Blocker" ? "pill-terra" : (item.cls === "Upgrade" ? "pill-ochre" : "pill-slate");
        return `
          <div class="audit-row transition-colors hover:bg-[#FAF7F2]">
            <button onclick="this.parentElement.classList.toggle('open')" class="w-full text-start px-5 py-3.5 flex items-start sm:items-center justify-between gap-4 cursor-pointer">
              <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3.5 min-w-0">
                <div class="flex items-center gap-2 flex-shrink-0">
                  <span class="font-mono text-xs ltr-token" style="color: var(--s-subtle);">${item.code}</span>
                  <span class="px-2.5 py-0.5 rounded text-xs font-semibold ${pillCls}">${pillText}</span>
                </div>
                <div class="min-w-0">
                  <div class="text-xs sm:text-sm font-semibold leading-snug" style="color: var(--s-ink);">${t.title}</div>
                  <div class="text-xs mt-0.5" style="color: var(--s-subtle);">${t.asset} &middot; ${t.loc} &middot; ${L.practiceLabels[item.pKey]}</div>
                </div>
              </div>
              <svg class="audit-chevron w-4 h-4 flex-shrink-0 mt-1 sm:mt-0" style="color: var(--s-subtle);" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </button>
            <div class="audit-drawer">
              <div class="audit-drawer-inner">
                <div class="px-5 py-3.5 text-xs leading-relaxed line-t" style="background-color: var(--s-sand); color: var(--s-muted);">
                  <strong style="color: var(--s-teal);">${L.recFixPrefix}</strong>${t.detail}
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function updateNavIndicator(btn) {
      const ind = document.getElementById("navIndicator");
      if (!ind || !btn) return;
      ind.style.width = `${btn.offsetWidth}px`;
      ind.style.transform = `translateX(${btn.offsetLeft}px)`;
      document.querySelectorAll(".chapter-link").forEach(el => {
        const active = el === btn;
        el.style.color = active ? "var(--s-ink)" : "var(--s-muted)";
        el.classList.toggle("font-semibold", active);
      });
    }

    function scrollToSection(id, btn) {
      if (btn) updateNavIndicator(btn);
      const target = document.getElementById(id);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function animateCounters() {
      document.querySelectorAll(".counter").forEach(el => {
        const target = parseInt(el.getAttribute("data-target"), 10);
        const start = performance.now();
        const dur = 950;
        const step = now => {
          const t = Math.min(1, (now - start) / dur);
          const ease = 1 - Math.pow(1 - t, 3);
          el.textContent = Math.round(target * ease);
          if (t < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    function initObservers() {
      const revealObs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add("in-view");
            if (e.target.id === "scorecardRows") {
              e.target.querySelectorAll(".score-fill").forEach((bar, idx) => {
                setTimeout(() => { bar.style.width = bar.getAttribute("data-width"); }, idx * 75);
              });
            }
          }
        });
      }, { threshold: 0.12 });

      document.querySelectorAll(".reveal, .photo-frame, #scorecardRows").forEach(el => revealObs.observe(el));

      const secObs = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            const btn = document.querySelector(`.chapter-link[data-target="${e.target.id}"]`);
            if (btn) updateNavIndicator(btn);
          }
        });
      }, { rootMargin: "-25% 0px -60% 0px" });

      ["sec-note", "sec-scorecard", "sec-brand", "sec-products", "sec-ledger", "sec-roadmap"].forEach(id => {
        const el = document.getElementById(id);
        if (el) secObs.observe(el);
      });

      window.addEventListener("scroll", () => {
        const doc = document.documentElement;
        const max = doc.scrollHeight - doc.clientHeight;
        const pct = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
        const bar = document.getElementById("scrollProgress");
        if (bar) bar.style.transform = `scaleX(${pct})`;
      }, { passive: true });

      window.addEventListener("resize", () => {
        const activeNav = document.querySelector(".chapter-link.font-semibold") || document.getElementById("nav01");
        updateNavIndicator(activeNav);
        const activeDosBtn = document.querySelector(`.dossier-btn[data-key="${activeDossierKey}"]`);
        updateDossierIndicator(activeDosBtn);
      });
    }

    (function init() {
      let initialLang = "en";
      try {
        const params = new URLSearchParams(window.location.search);
        if (params.get("lang") === "ar" || window.location.hash === "#ar") initialLang = "ar";
      } catch (_) {}
      setLanguage(initialLang, true);
      initObservers();
      animateCounters();
    })();
  </script>
</body>
</html>
