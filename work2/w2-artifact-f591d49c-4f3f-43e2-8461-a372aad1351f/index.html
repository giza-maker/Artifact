<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English to Arabic Tutor – Beginners</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #f0f4ff;
    --card-bg:   #ffffff;
    --primary:   #4f46e5;
    --accent:    #10b981;
    --arabic:    #be123c;
    --text:      #1e293b;
    --muted:     #64748b;
    --radius:    16px;
    --shadow:    0 4px 24px rgba(79,70,229,.12);
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    color: #fff;
    text-align: center;
    padding: 48px 24px 36px;
    clip-path: ellipse(100% 88% at 50% 12%);
  }
  header h1 { font-size: clamp(1.6rem, 4vw, 2.6rem); font-weight: 700; letter-spacing: -.5px; }
  header p  { margin-top: 8px; opacity: .85; font-size: .95rem; }

  /* ── PROGRESS ── */
  .progress-wrap {
    max-width: 860px;
    margin: 28px auto 0;
    padding: 0 20px;
  }
  .progress-bar {
    height: 8px;
    border-radius: 99px;
    background: #e2e8f0;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), #06b6d4);
    transition: width .4s ease;
  }
  .progress-label {
    font-size: .8rem;
    color: var(--muted);
    margin-top: 6px;
    text-align: right;
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px;
    max-width: 960px;
    margin: 40px auto 0;
    padding: 0 20px;
  }

  /* ── CARD ── */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: transform .2s, box-shadow .2s;
    cursor: default;
    position: relative;
    overflow: hidden;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 5px; height: 100%;
    background: linear-gradient(180deg, var(--primary), var(--accent));
    border-radius: 99px 0 0 99px;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 10px 36px rgba(79,70,229,.18); }

  .card-number {
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--primary);
    opacity: .65;
  }

  .english {
    font-size: 1.55rem;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.2;
  }

  .pronunciation {
    font-size: .85rem;
    color: var(--muted);
    font-style: italic;
  }

  .arabic {
    font-family: 'Amiri', serif;
    font-size: 2rem;
    font-weight: 700;
    color: var(--arabic);
    text-align: right;
    direction: rtl;
    line-height: 1.4;
    border-top: 1px solid #f1f5f9;
    padding-top: 10px;
    margin-top: 2px;
  }

  .transliteration {
    font-size: .8rem;
    color: #94a3b8;
    text-align: right;
  }

  .example {
    background: #f8fafc;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: .83rem;
    color: var(--muted);
    line-height: 1.55;
  }
  .example strong { color: var(--text); font-weight: 600; }

  .example-arabic {
    font-family: 'Amiri', serif;
    font-size: 1.05rem;
    color: var(--arabic);
    direction: rtl;
    text-align: right;
    margin-top: 4px;
  }

  /* ── CONTROLS ── */
  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }

  .btn-speak {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: .78rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .18s, transform .12s;
  }
  .btn-speak:hover { background: #4338ca; transform: scale(1.04); }
  .btn-speak svg { width: 14px; height: 14px; fill: currentColor; }

  .btn-known {
    display: flex;
    align-items: center;
    gap: 5px;
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: .78rem;
    font-weight: 600;
    cursor: pointer;
    transition: .18s;
  }
  .btn-known.active { background: var(--accent); color: #fff; }
  .btn-known:hover:not(.active) { background: #d1fae5; }

  /* ── QUIZ SECTION ── */
  .quiz-wrap {
    max-width: 680px;
    margin: 50px auto 0;
    padding: 0 20px;
    text-align: center;
  }
  .quiz-wrap h2 {
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 20px;
  }
  .quiz-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 36px 32px;
  }
  .quiz-question {
    font-size: 2rem;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 24px;
  }
  .quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .quiz-opt {
    font-family: 'Amiri', serif;
    font-size: 1.4rem;
    direction: rtl;
    background: #f8fafc;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: .18s;
    color: var(--text);
  }
  .quiz-opt:hover { border-color: var(--primary); background: #eef2ff; }
  .quiz-opt.correct { border-color: var(--accent); background: #d1fae5; color: #065f46; }
  .quiz-opt.wrong   { border-color: #ef4444; background: #fee2e2; color: #991b1b; }

  .quiz-feedback {
    margin-top: 18px;
    font-size: .9rem;
    font-weight: 600;
    min-height: 24px;
  }
  .quiz-feedback.ok  { color: var(--accent); }
  .quiz-feedback.bad { color: #ef4444; }

  .btn-next {
    margin-top: 22px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 36px;
    font-size: .9rem;
    font-weight: 700;
    cursor: pointer;
    transition: background .18s;
    display: none;
  }
  .btn-next:hover { background: #4338ca; }

  .score-board {
    margin-top: 20px;
    font-size: .85rem;
    color: var(--muted);
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    margin-top: 60px;
    font-size: .78rem;
    color: #94a3b8;
  }
</style>
</head>
<body>

<header>
  <h1>🌙 English → Arabic Tutor</h1>
  <p>Learn 15 essential words with pronunciation & examples — perfect for beginners</p>
</header>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="progress-label" id="progressLabel">0 / 15 words learned</div>
</div>

<div class="grid" id="wordGrid"></div>

<div class="quiz-wrap">
  <h2>🧠 Quick Quiz</h2>
  <div class="quiz-card">
    <div class="quiz-question" id="quizQuestion">—</div>
    <div class="quiz-options" id="quizOptions"></div>
    <div class="quiz-feedback" id="quizFeedback"></div>
    <button class="btn-next" id="btnNext" onclick="nextQuiz()">Next →</button>
    <div class="score-board" id="scoreBoard">Score: 0 correct</div>
  </div>
</div>

<footer>Built with ♥ for Arabic learners · Uses browser-native speech synthesis</footer>

<script>
const WORDS = [
  { en:"Hello",       ar:"مرحبا",         translit:"Marhaba",      pron:"heh-LOH",      enEx:"Hello, how are you?",        arEx:"مرحبا، كيف حالك؟" },
  { en:"Thank you",   ar:"شكراً",          translit:"Shukran",      pron:"SHOOK-ran",    enEx:"Thank you very much!",       arEx:"شكراً جزيلاً!" },
  { en:"Please",      ar:"من فضلك",        translit:"Min fadlak",   pron:"min FAD-lak",  enEx:"Please help me.",            arEx:"من فضلك ساعدني." },
  { en:"Yes",         ar:"نعم",            translit:"Na'am",        pron:"NAH-am",       enEx:"Yes, I understand.",         arEx:"نعم، أنا أفهم." },
  { en:"No",          ar:"لا",             translit:"Laa",          pron:"lah",          enEx:"No, thank you.",             arEx:"لا، شكراً." },
  { en:"Water",       ar:"ماء",            translit:"Maa'",         pron:"mah",          enEx:"I need water, please.",      arEx:"أحتاج ماء من فضلك." },
  { en:"Food",        ar:"طعام",           translit:"Ta'aam",       pron:"tah-AM",       enEx:"The food is delicious.",     arEx:"الطعام لذيذ." },
  { en:"Good",        ar:"جيد",            translit:"Jayyid",       pron:"JAY-yid",      enEx:"Good morning!",              arEx:"صباح الخير!" },
  { en:"Goodbye",     ar:"مع السلامة",     translit:"Ma'a salama",  pron:"mah-as-sa-LA-ma", enEx:"Goodbye, see you soon!",  arEx:"مع السلامة، أراك قريباً!" },
  { en:"Help",        ar:"مساعدة",         translit:"Musaa'ada",    pron:"moo-SAH-a-da", enEx:"I need help.",               arEx:"أحتاج مساعدة." },
  { en:"House",       ar:"بيت",            translit:"Bayt",         pron:"bite",         enEx:"My house is big.",           arEx:"بيتي كبير." },
  { en:"Friend",      ar:"صديق",           translit:"Sadeeq",       pron:"sa-DEEK",      enEx:"She is my friend.",          arEx:"هي صديقتي." },
  { en:"Beautiful",   ar:"جميل",           translit:"Jameel",       pron:"ja-MEEL",      enEx:"The sky is beautiful.",      arEx:"السماء جميلة." },
  { en:"Book",        ar:"كتاب",           translit:"Kitaab",       pron:"ki-TAB",       enEx:"I read a book every day.",   arEx:"أقرأ كتاباً كل يوم." },
  { en:"Love",        ar:"حب",             translit:"Hubb",         pron:"hoob",         enEx:"Love is a beautiful feeling.",arEx:"الحب شعور جميل." },
];

let known = new Set();
let quizIdx = 0, score = 0, quizAnswered = false;
const quizOrder = shuffle([...Array(WORDS.length).keys()]);

/* ── Build cards ── */
function buildCards() {
  const grid = document.getElementById('wordGrid');
  WORDS.forEach((w, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${i}`;
    card.innerHTML = `
      <div class="card-number">Word ${String(i+1).padStart(2,'0')}</div>
      <div class="english">${w.en}</div>
      <div class="pronunciation">/${w.pron}/</div>
      <div class="arabic">${w.ar}</div>
      <div class="transliteration">${w.translit}</div>
      <div class="example">
        <strong>EN:</strong> ${w.enEx}
        <div class="example-arabic">${w.arEx}</div>
      </div>
      <div class="card-footer">
        <button class="btn-speak" onclick="speak('${w.en.replace(/'/g,"\\'")}')">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          Listen
        </button>
        <button class="btn-known" id="known-${i}" onclick="toggleKnown(${i})">✓ I know this</button>
      </div>`;
    grid.appendChild(card);
  });
}

function speak(word) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(word);
  u.lang = 'en-US'; u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function toggleKnown(i) {
  const btn = document.getElementById(`known-${i}`);
  if (known.has(i)) { known.delete(i); btn.classList.remove('active'); btn.textContent = '✓ I know this'; }
  else              { known.add(i);    btn.classList.add('active');    btn.textContent = '★ Learned!'; }
  updateProgress();
}

function updateProgress() {
  const pct = Math.round((known.size / WORDS.length) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLabel').textContent = `${known.size} / ${WORDS.length} words learned`;
}

/* ── Quiz ── */
function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; }

function loadQuiz() {
  if (quizIdx >= quizOrder.length) { endQuiz(); return; }
  quizAnswered = false;
  const correct = WORDS[quizOrder[quizIdx]];
  document.getElementById('quizQuestion').textContent = correct.en;
  document.getElementById('quizFeedback').textContent = '';
  document.getElementById('quizFeedback').className = 'quiz-feedback';
  document.getElementById('btnNext').style.display = 'none';

  // 4 options: correct + 3 random wrong
  const pool = [...Array(WORDS.length).keys()].filter(k => k !== quizOrder[quizIdx]);
  const opts = shuffle(pool).slice(0, 3);
  opts.push(quizOrder[quizIdx]);
  shuffle(opts);

  const container = document.getElementById('quizOptions');
  container.innerHTML = '';
  opts.forEach(idx => {
    const btn = document.createElement('button');
    btn.className = 'quiz-opt';
    btn.textContent = WORDS[idx].ar;
    btn.dataset.idx = idx;
    btn.onclick = () => checkAnswer(btn, quizOrder[quizIdx]);
    container.appendChild(btn);
  });
}

function checkAnswer(btn, correctIdx) {
  if (quizAnswered) return;
  quizAnswered = true;
  const fb = document.getElementById('quizFeedback');
  if (parseInt(btn.dataset.idx) === correctIdx) {
    btn.classList.add('correct');
    fb.textContent = '✅ Correct! Well done!';
    fb.className = 'quiz-feedback ok';
    score++;
  } else {
    btn.classList.add('wrong');
    fb.textContent = `❌ The answer is: ${WORDS[correctIdx].ar} (${WORDS[correctIdx].translit})`;
    fb.className = 'quiz-feedback bad';
    // highlight correct
    document.querySelectorAll('.quiz-opt').forEach(b => {
      if (parseInt(b.dataset.idx) === correctIdx) b.classList.add('correct');
    });
  }
  document.getElementById('scoreBoard').textContent = `Score: ${score} correct out of ${quizIdx+1} answered`;
  document.getElementById('btnNext').style.display = 'inline-block';
}

function nextQuiz() { quizIdx++; loadQuiz(); }

function endQuiz() {
  document.getElementById('quizQuestion').textContent = '🎉 Quiz Complete!';
  document.getElementById('quizOptions').innerHTML = '';
  document.getElementById('quizFeedback').textContent = '';
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('scoreBoard').textContent = `Final score: ${score} / ${WORDS.length} correct`;
}

buildCards();
loadQuiz();
</script>
</body>
</html>
