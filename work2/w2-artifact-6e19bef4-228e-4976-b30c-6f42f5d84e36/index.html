<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sleepy Sheep - A calming single-page web app game designed to help you fall asleep faster.">
    <title>Sleepy Sheep</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* Styles integrated from visual shell child task */
        body {
            background-color: black;
            color: white;
            font-family: 'Georgia', serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .sheep, .controls {
            /* Add necessary CSS from child tasks */
        }
        /* Additional styles for animations and interactions */
    </style>
</head>
<body>
    <div id="app">
        <!-- Sleepy Sheep Game Structure -->
        <div id="sheep-container">
            <!-- Sheep elements and clouds will be dynamically added here -->
        </div>
        <div class="controls">
            <!-- Includes volume slider, sleep timer, and other controls -->
        </div>
    </div>

    <script>
        // Service Worker for caching
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
            .then(() => console.log('Service Worker Registered'))
            .catch(err => console.error('Service Worker Registration failed:', err));
        }

        // Audio and animation scripts integrated from child tasks
        function initGame() {
            /* Initialization code for sheep animations, audio, and interactions */
        }

        document.addEventListener('DOMContentLoaded', (event) => {
            // Tap-to-start requirement for audio
            const startButton = document.createElement('button');
            startButton.innerText = "Start Sleepy Sheep";
            document.body.appendChild(startButton);
            startButton.addEventListener('click', () => {
                document.body.removeChild(startButton);
                initGame();
            });
        });
    </script>
</body>
</html>
