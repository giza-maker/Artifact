<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multilingual Greeting</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    /* Animated background particles */
    .bg-particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 0.15; }
      90%  { opacity: 0.15; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 60px 70px;
      text-align: center;
      max-width: 540px;
      width: 90%;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.15);
      animation: cardIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(40px) scale(0.92); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Globe icon */
    .globe {
      font-size: 3rem;
      margin-bottom: 20px;
      display: block;
      animation: spin 12s linear infinite;
      filter: drop-shadow(0 0 12px rgba(100, 200, 255, 0.5));
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Greeting text */
    #greeting {
      font-size: clamp(3.5rem, 12vw, 6.5rem);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1;
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #a8edea 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradientShift 4s ease infinite;
      margin-bottom: 18px;
      word-break: break-word;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Divider */
    .divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      margin: 0 auto 18px;
      border-radius: 2px;
    }

    /* Language label */
    #language {
      font-size: 1.1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.65);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Refresh hint */
    .hint {
      margin-top: 36px;
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.28);
      letter-spacing: 0.08em;
    }

    .hint kbd {
      display: inline-block;
      padding: 2px 7px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 5px;
      font-family: inherit;
      font-size: inherit;
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.4);
    }

    /* Flag emoji */
    .flag {
      font-size: 2.2rem;
      margin-top: 16px;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }

    /* Count badge */
    .badge {
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 0.7rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- Background particles (JS will populate) -->
  <div class="bg-particles" id="particles"></div>

  <!-- Main card -->
  <div class="card">
    <span class="badge" id="badge"></span>
    <span class="globe">🌍</span>
    <div id="greeting">Hello</div>
    <div class="divider"></div>
    <div id="language">English</div>
    <span class="flag" id="flag">🏳️</span>
    <p class="hint">Refresh for a new greeting &nbsp;·&nbsp; <kbd>F5</kbd></p>
  </div>

  <script>
    // ─── Data: 32 greetings ───────────────────────────────────────────────────
    const greetings = [
      { word: "Hello",       language: "English",             flag: "🇬🇧" },
      { word: "Hola",        language: "Spanish",             flag: "🇪🇸" },
      { word: "Bonjour",     language: "French",              flag: "🇫🇷" },
      { word: "Ciao",        language: "Italian",             flag: "🇮🇹" },
      { word: "Hallo",       language: "German",              flag: "🇩🇪" },
      { word: "Olá",         language: "Portuguese",          flag: "🇵🇹" },
      { word: "Привет",      language: "Russian",             flag: "🇷🇺" },
      { word: "مرحبا",       language: "Arabic",              flag: "🇸🇦" },
      { word: "你好",         language: "Mandarin Chinese",    flag: "🇨🇳" },
      { word: "こんにちは",   language: "Japanese",            flag: "🇯🇵" },
      { word: "안녕하세요",   language: "Korean",              flag: "🇰🇷" },
      { word: "नमस्ते",      language: "Hindi",               flag: "🇮🇳" },
      { word: "Merhaba",     language: "Turkish",             flag: "🇹🇷" },
      { word: "Hej",         language: "Swedish",             flag: "🇸🇪" },
      { word: "Hei",         language: "Norwegian",           flag: "🇳🇴" },
      { word: "Hei",         language: "Finnish",             flag: "🇫🇮" },
      { word: "Γεια σου",    language: "Greek",               flag: "🇬🇷" },
      { word: "Shalom",      language: "Hebrew",              flag: "🇮🇱" },
      { word: "Sawubona",    language: "Zulu",                flag: "🇿🇦" },
      { word: "Jambo",       language: "Swahili",             flag: "🇰🇪" },
      { word: "Salut",       language: "Romanian",            flag: "🇷🇴" },
      { word: "Ahoj",        language: "Czech",               flag: "🇨🇿" },
      { word: "Czesc",       language: "Polish",              flag: "🇵🇱" },
      { word: "Szia",        language: "Hungarian",           flag: "🇭🇺" },
      { word: "Dia dhuit",   language: "Irish",               flag: "🇮🇪" },
      { word: "Kamusta",     language: "Filipino",            flag: "🇵🇭" },
      { word: "Xin chào",    language: "Vietnamese",          flag: "🇻🇳" },
      { word: "สวัสดี",      language: "Thai",                flag: "🇹🇭" },
      { word: "Selamat",     language: "Malay",               flag: "🇲🇾" },
      { word: "Selam",       language: "Amharic",             flag: "🇪🇹" },
      { word: "Aloha",       language: "Hawaiian",            flag: "🌺"  },
      { word: "Сайн уу",     language: "Mongolian",           flag: "🇲🇳" },
    ];

    // ─── Random pick on load ──────────────────────────────────────────────────
    const idx    = Math.floor(Math.random() * greetings.length);
    const chosen = greetings[idx];

    document.getElementById("greeting").textContent  = chosen.word;
    document.getElementById("language").textContent  = chosen.language;
    document.getElementById("flag").textContent      = chosen.flag;
    document.getElementById("badge").textContent     = `${idx + 1} / ${greetings.length}`;

    // ─── Background particles ─────────────────────────────────────────────────
    const container = document.getElementById("particles");
    const colors    = ["#a8edea", "#fed6e3", "#c2e9fb", "#ffecd2", "#d4a4eb"];

    for (let i = 0; i < 28; i++) {
      const el   = document.createElement("div");
      el.classList.add("particle");
      const size = Math.random() * 18 + 6;
      el.style.cssText = [
        `width:${size}px`,
        `height:${size}px`,
        `left:${Math.random() * 100}%`,
        `background:${colors[Math.floor(Math.random() * colors.length)]}`,
        `animation-duration:${Math.random() * 14 + 8}s`,
        `animation-delay:${Math.random() * -20}s`,
      ].join(";");
      container.appendChild(el);
    }
  </script>
</body>
</html>
