<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOCKS Work — Skill Forge Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple: #7c3aed;
    --purple-light: #a855f7;
    --purple-dark: #4c1d95;
    --cyan: #06b6d4;
    --cyan-light: #22d3ee;
    --cyan-dark: #0e7490;
    --amber: #fbbf24;
    --amber-light: #fde68a;
    --amber-dark: #b45309;
    --ink: #1a1a2e;
    --white: #ffffff;
    --shadow-offset: 5px;
    --shadow-color: rgba(0,0,0,0.85);
  }

  body {
    min-height: 100vh;
    background: #e8d5ff;
    background-image:
      radial-gradient(circle at 20% 20%, #c4b5fd 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #a5f3fc 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, #fef3c7 0%, transparent 60%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    font-family: 'Nunito', sans-serif;
  }

  /* === WIDGET SHELL === */
  .widget {
    width: 100%;
    max-width: 480px;
    background: #ffffff;
    border: 4px solid var(--ink);
    border-radius: 24px;
    box-shadow: var(--shadow-offset) var(--shadow-offset) 0 var(--shadow-color);
    overflow: hidden;
    animation: fx-enter 620ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes fx-enter {
    from { opacity: 0; transform: translate3d(0, 18px, 0) scale(0.985); }
    to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
  }

  /* === HEADER BAND === */
  .widget-header {
    background: var(--purple);
    border-bottom: 4px solid var(--ink);
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }

  .widget-header::before {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: var(--purple-light);
    border-radius: 50%;
    opacity: 0.4;
  }

  .widget-header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: 40%;
    width: 80px; height: 80px;
    background: var(--cyan);
    border-radius: 50%;
    opacity: 0.25;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    position: relative;
    z-index: 2;
  }

  .brand-icon {
    width: 40px; height: 40px;
    background: var(--amber);
    border: 3px solid var(--ink);
    border-radius: 10px;
    box-shadow: 3px 3px 0 var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.2rem;
    flex-shrink: 0;
  }

  .brand-text {
    font-family: 'Fredoka One', cursive;
    color: var(--white);
    line-height: 1;
  }

  .brand-text .blocks { font-size: 1.5rem; letter-spacing: 0.03em; }
  .brand-text .sub    { font-size: 0.75rem; color: var(--amber-light); letter-spacing: 0.1em; text-transform: uppercase; }

  .status-pill {
    background: #22c55e;
    color: var(--white);
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.3rem 0.7rem;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    box-shadow: 2px 2px 0 var(--ink);
    position: relative;
    z-index: 2;
    display: flex; align-items: center; gap: 0.35rem;
    animation: fx-pulse-ring 2.6s ease-in-out infinite;
  }

  @keyframes fx-pulse-ring {
    0%,100% { box-shadow: 2px 2px 0 var(--ink), 0 0 0 0 rgba(34,197,94,0.4); }
    50%      { box-shadow: 2px 2px 0 var(--ink), 0 0 0 8px rgba(34,197,94,0); }
  }

  .status-dot {
    width: 7px; height: 7px;
    background: #bbf7d0;
    border-radius: 50%;
  }

  /* === KPI GRID === */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
  }

  .kpi-card {
    padding: 1.25rem 1rem;
    border-right: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);
    position: relative;
    cursor: default;
    transition: transform 180ms ease, box-shadow 180ms ease;
    animation: fx-enter 560ms cubic-bezier(0.22, 1, 0.36, 1) both;
    overflow: hidden;
  }

  .kpi-card:nth-child(1) { animation-delay: 80ms; }
  .kpi-card:nth-child(2) { animation-delay: 150ms; }
  .kpi-card:nth-child(3) { animation-delay: 220ms; border-right: none; }

  .kpi-card:hover {
    transform: translateY(-3px);
    z-index: 2;
  }

  .kpi-card--purple { background: #f3e8ff; }
  .kpi-card--cyan   { background: #ecfeff; }
  .kpi-card--amber  { background: #fffbeb; }

  .kpi-card__blob {
    position: absolute;
    top: -20px; right: -20px;
    width: 70px; height: 70px;
    border-radius: 50%;
    opacity: 0.2;
  }
  .kpi-card--purple .kpi-card__blob { background: var(--purple); }
  .kpi-card--cyan   .kpi-card__blob { background: var(--cyan); }
  .kpi-card--amber  .kpi-card__blob { background: var(--amber); }

  .kpi-icon {
    width: 32px; height: 32px;
    border: 2.5px solid var(--ink);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.95rem;
    margin-bottom: 0.6rem;
    position: relative;
  }
  .kpi-card--purple .kpi-icon { background: var(--purple); box-shadow: 2px 2px 0 var(--ink); }
  .kpi-card--cyan   .kpi-icon { background: var(--cyan);   box-shadow: 2px 2px 0 var(--ink); }
  .kpi-card--amber  .kpi-icon { background: var(--amber);  box-shadow: 2px 2px 0 var(--ink); }

  .kpi-value {
    font-family: 'Fredoka One', cursive;
    font-size: 2.4rem;
    line-height: 1;
    color: var(--ink);
    margin-bottom: 0.2rem;
    position: relative;
  }

  .kpi-card--purple .kpi-value { color: var(--purple-dark); }
  .kpi-card--cyan   .kpi-value { color: var(--cyan-dark); }
  .kpi-card--amber  .kpi-value { color: var(--amber-dark); }

  .kpi-label {
    font-size: 0.65rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink);
    opacity: 0.6;
    line-height: 1.3;
  }

  .kpi-delta {
    margin-top: 0.5rem;
    font-size: 0.7rem;
    font-weight: 800;
    padding: 0.15rem 0.45rem;
    border: 2px solid var(--ink);
    border-radius: 6px;
    display: inline-block;
    box-shadow: 1.5px 1.5px 0 var(--ink);
    background: var(--white);
  }

  .delta-up   { color: #16a34a; }
  .delta-same { color: #0369a1; }

  /* === PROGRESS BAR === */
  .progress-section {
    padding: 1rem 1.25rem;
    border-bottom: 3px solid var(--ink);
    background: #fafafa;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.55rem;
  }

  .progress-label {
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink);
  }

  .progress-pct {
    font-family: 'Fredoka One', cursive;
    font-size: 0.95rem;
    color: var(--purple);
  }

  .progress-track {
    height: 14px;
    background: #e2e8f0;
    border: 2.5px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
    box-shadow: 2px 2px 0 var(--ink);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--purple), var(--cyan));
    border-radius: 999px;
    width: 0%;
    animation: fill-bar 1.2s 0.4s cubic-bezier(0.22,1,0.36,1) forwards;
  }

  @keyframes fill-bar {
    to { width: 100%; }
  }

  /* === FOOTER ACTION === */
  .widget-footer {
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--ink);
  }

  .footer-copy {
    font-size: 0.72rem;
    font-weight: 700;
    color: #94a3b8;
    letter-spacing: 0.04em;
  }

  .footer-copy strong {
    color: var(--amber);
    font-weight: 900;
  }

  .btn-forge {
    background: var(--amber);
    color: var(--ink);
    font-family: 'Fredoka One', cursive;
    font-size: 0.85rem;
    letter-spacing: 0.04em;
    padding: 0.45rem 1rem;
    border: 2.5px solid var(--white);
    border-radius: 10px;
    box-shadow: 3px 3px 0 rgba(255,255,255,0.6);
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; gap: 0.35rem;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }

  .btn-forge:hover {
    transform: translateY(-2px);
    box-shadow: 4px 5px 0 rgba(255,255,255,0.6);
  }
  .btn-forge:active {
    transform: translateY(1px);
    box-shadow: 1px 1px 0 rgba(255,255,255,0.6);
  }

  /* === TICKER ANIMATION === */
  @keyframes count-up {
    from { opacity: 0.2; transform: scale(0.85); }
    to   { opacity: 1;   transform: scale(1); }
  }

  .kpi-value { animation: count-up 400ms ease both; }
  .kpi-card:nth-child(1) .kpi-value { animation-delay: 200ms; }
  .kpi-card:nth-child(2) .kpi-value { animation-delay: 300ms; }
  .kpi-card:nth-child(3) .kpi-value { animation-delay: 400ms; }

  /* === RESPONSIVE === */
  @media (max-width: 400px) {
    .kpi-value { font-size: 1.8rem; }
    .kpi-card  { padding: 1rem 0.75rem; }
    .brand-text .blocks { font-size: 1.25rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .widget, .kpi-card, .progress-fill, .status-pill, .kpi-value {
      animation: none !important;
      transition: none !important;
    }
    .progress-fill { width: 100%; }
  }
</style>
</head>
<body>

<div class="widget" role="main" aria-label="BLOCKS Work Skill Forge Dashboard">

  <!-- HEADER -->
  <header class="widget-header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">⚡</div>
      <div class="brand-text">
        <div class="blocks">BLOCKS Work</div>
        <div class="sub">Skill Forge · Live</div>
      </div>
    </div>
    <div class="status-pill" role="status" aria-label="All systems operational">
      <span class="status-dot"></span>
      All Systems Go
    </div>
  </header>

  <!-- KPI GRID -->
  <section class="kpi-grid" aria-label="Key performance indicators">

    <div class="kpi-card kpi-card--purple" role="article" aria-label="Active Agents">
      <div class="kpi-card__blob" aria-hidden="true"></div>
      <div class="kpi-icon" aria-hidden="true">🤖</div>
      <div class="kpi-value" aria-label="12">12</div>
      <div class="kpi-label">Active<br>Agents</div>
      <div class="kpi-delta delta-up" aria-label="Up 3 from yesterday">↑ +3 today</div>
    </div>

    <div class="kpi-card kpi-card--cyan" role="article" aria-label="Tasks Today">
      <div class="kpi-card__blob" aria-hidden="true"></div>
      <div class="kpi-icon" aria-hidden="true">✅</div>
      <div class="kpi-value" aria-label="847">847</div>
      <div class="kpi-label">Tasks<br>Today</div>
      <div class="kpi-delta delta-up" aria-label="Up 12 percent">↑ +12%</div>
    </div>

    <div class="kpi-card kpi-card--amber" role="article" aria-label="Skills Learned">
      <div class="kpi-card__blob" aria-hidden="true"></div>
      <div class="kpi-icon" aria-hidden="true">🧠</div>
      <div class="kpi-value" aria-label="31">31</div>
      <div class="kpi-label">Skills<br>Learned</div>
      <div class="kpi-delta delta-same" aria-label="2 new this session">★ 2 new</div>
    </div>

  </section>

  <!-- PROGRESS -->
  <div class="progress-section" aria-label="Skill Forge completion status">
    <div class="progress-header">
      <span class="progress-label">Forge Completion</span>
      <span class="progress-pct" aria-label="100 percent complete">100%</span>
    </div>
    <div class="progress-track" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" aria-label="Skill Forge 100 percent complete">
      <div class="progress-fill"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="widget-footer">
    <span class="footer-copy">Proof verified · <strong>Level 20</strong></span>
    <a class="btn-forge" href="#" role="button" aria-label="Open Skill Forge">
      Open Forge ⚡
    </a>
  </footer>

</div>

</body>
</html>
