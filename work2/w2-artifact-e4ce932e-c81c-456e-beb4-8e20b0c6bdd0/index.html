<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐱 Cat Sound Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #f5efe5;
      --bg-panel: rgba(255, 252, 247, 0.92);
      --bg-accent: #17313e;
      --fg-strong: #1f1a17;
      --fg-muted: #5e544c;
      --fg-inverse: #f8f4ee;
      --line-soft: rgba(36, 31, 27, 0.1);
      --line-strong: rgba(23, 49, 62, 0.22);
      --accent-primary: #d5663a;
      --accent-secondary: #58837a;
      --accent-highlight: #f3c969;
      --radius-card: 32px;
      --radius-pill: 999px;
      --shadow-soft: 0 18px 44px rgba(27, 31, 36, 0.11);
      --shadow-strong: 0 28px 72px rgba(16, 19, 24, 0.2);
      --space-1: 0.375rem;
      --space-2: 0.75rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2rem;
      --space-6: 3rem;
      --space-7: 4.5rem;
      --display-font: "DM Serif Display", Georgia, serif;
      --body-font: "DM Sans", "Segoe UI", sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--body-font);
      background: var(--bg-canvas);
      color: var(--fg-strong);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--space-5) var(--space-4);
      position: relative;
      overflow: hidden;
    }

    /* Atmospheric background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 15%, rgba(213, 102, 58, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 85%, rgba(88, 131, 122, 0.09) 0%, transparent 60%),
        radial-gradient(ellipse 80% 40% at 50% 105%, rgba(243, 201, 105, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Noise grain texture */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    /* Floating paw prints */
    .paw-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .paw-bg span {
      position: absolute;
      font-size: clamp(20px, 3vw, 40px);
      opacity: 0.045;
      animation: float-paw 20s ease-in-out infinite;
    }

    .paw-bg span:nth-child(1)  { top: 5%;  left: 8%;  animation-delay: 0s;    animation-duration: 18s; }
    .paw-bg span:nth-child(2)  { top: 15%; left: 85%; animation-delay: 3s;    animation-duration: 22s; }
    .paw-bg span:nth-child(3)  { top: 30%; left: 5%;  animation-delay: 6s;    animation-duration: 16s; }
    .paw-bg span:nth-child(4)  { top: 60%; left: 90%; animation-delay: 1s;    animation-duration: 25s; }
    .paw-bg span:nth-child(5)  { top: 75%; left: 12%; animation-delay: 9s;    animation-duration: 20s; }
    .paw-bg span:nth-child(6)  { top: 88%; left: 70%; animation-delay: 4s;    animation-duration: 19s; }
    .paw-bg span:nth-child(7)  { top: 45%; left: 92%; animation-delay: 12s;   animation-duration: 17s; }
    .paw-bg span:nth-child(8)  { top: 95%; left: 35%; animation-delay: 7s;    animation-duration: 23s; }

    @keyframes float-paw {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25%       { transform: translateY(-12px) rotate(8deg); }
      75%       { transform: translateY(8px) rotate(-6deg); }
    }

    /* Page layout */
    .page-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-4);
      width: 100%;
      max-width: 480px;
    }

    /* Header */
    .header {
      text-align: center;
      animation: fx-enter 640ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
      font-family: var(--body-font);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent-primary);
      background: rgba(213, 102, 58, 0.1);
      border: 1px solid rgba(213, 102, 58, 0.2);
      padding: 0.3rem 0.9rem;
      border-radius: var(--radius-pill);
      margin-bottom: var(--space-2);
    }

    .header h1 {
      font-family: var(--display-font);
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 400;
      color: var(--fg-strong);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .header h1 em {
      font-style: italic;
      color: var(--accent-primary);
    }

    .header p {
      margin-top: var(--space-2);
      font-size: 1.05rem;
      color: var(--fg-muted);
      font-weight: 400;
    }

    /* Main card */
    .cat-card {
      background: var(--bg-panel);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-soft);
      padding: var(--space-6) var(--space-5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-4);
      width: 100%;
      border: 1.5px solid var(--line-soft);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: fx-enter 640ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
      position: relative;
      overflow: hidden;
    }

    /* Card inner glow on active */
    .cat-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-card);
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(213, 102, 58, 0.0) 0%, transparent 70%);
      transition: background 0.4s ease;
      pointer-events: none;
    }

    .cat-card.active-glow::before {
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(213, 102, 58, 0.1) 0%, transparent 70%);
    }

    /* Cat button */
    .cat-button-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 180px;
      height: 180px;
    }

    .glow-ring {
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 2.5px solid var(--accent-primary);
      opacity: 0;
      pointer-events: none;
    }

    .glow-ring.pulse {
      animation: pulse-ring 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    @keyframes pulse-ring {
      0%   { transform: scale(0.85); opacity: 0.9; border-color: var(--accent-primary); }
      60%  { opacity: 0.5; }
      100% { transform: scale(1.5); opacity: 0; border-color: var(--accent-highlight); }
    }

    .glow-ring-2 {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 1.5px solid var(--accent-secondary);
      opacity: 0;
      pointer-events: none;
    }

    .glow-ring-2.pulse {
      animation: pulse-ring-2 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.1s forwards;
    }

    @keyframes pulse-ring-2 {
      0%   { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    .cat-btn {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(145deg, #fde8d8 0%, #fcd0b0 45%, #f4a87a 100%);
      box-shadow:
        var(--shadow-soft),
        inset 0 3px 6px rgba(255, 255, 255, 0.7),
        inset 0 -2px 4px rgba(180, 80, 20, 0.08),
        0 0 0 5px rgba(213, 102, 58, 0.12);
      position: relative;
      transition:
        transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.18s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      z-index: 1;
    }

    .cat-btn:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow:
        var(--shadow-strong),
        inset 0 3px 6px rgba(255, 255, 255, 0.7),
        0 0 0 7px rgba(213, 102, 58, 0.18);
    }

    .cat-btn:active,
    .cat-btn.pressing {
      transform: scale(0.92);
      box-shadow:
        0 6px 18px rgba(27, 31, 36, 0.12),
        inset 0 2px 8px rgba(180, 80, 20, 0.18);
      transition: transform 0.07s ease, box-shadow 0.07s ease;
    }

    .cat-face {
      font-size: 80px;
      line-height: 1;
      display: block;
      user-select: none;
      transition: transform 0.18s ease;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.12));
    }

    .cat-btn.bouncing .cat-face {
      animation: cat-bounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes cat-bounce {
      0%   { transform: scale(1) rotate(0deg); }
      30%  { transform: scale(1.25) rotate(-8deg); }
      60%  { transform: scale(0.92) rotate(4deg); }
      80%  { transform: scale(1.06) rotate(-2deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    /* Sound name label */
    .sound-display {
      font-family: var(--display-font);
      font-size: 1.65rem;
      font-weight: 400;
      font-style: italic;
      color: var(--accent-primary);
      min-height: 2.4rem;
      text-align: center;
      letter-spacing: 0.01em;
      opacity: 0;
      transform: translateY(6px) scale(0.96);
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: opacity, transform;
    }

    .sound-display.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    /* Sound indicator dots */
    .sound-indicators {
      display: flex;
      gap: var(--space-3);
      align-items: center;
    }

    .indicator-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(36, 31, 27, 0.15);
      transition:
        background 0.28s ease,
        transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
        box-shadow 0.28s ease;
    }

    .indicator-dot.active {
      transform: scale(1.5);
    }

    .indicator-dot[data-sound="1"].active {
      background: var(--accent-primary);
      box-shadow: 0 0 12px rgba(213, 102, 58, 0.55);
    }

    .indicator-dot[data-sound="2"].active {
      background: var(--accent-secondary);
      box-shadow: 0 0 12px rgba(88, 131, 122, 0.55);
    }

    .indicator-dot[data-sound="3"].active {
      background: var(--accent-highlight);
      box-shadow: 0 0 12px rgba(243, 201, 105, 0.7);
    }

    /* Sound labels row */
    .sound-labels {
      display: flex;
      gap: var(--space-3);
      align-items: center;
    }

    .sound-label {
      font-family: var(--body-font);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg-muted);
      opacity: 0.6;
      transition: opacity 0.3s ease, color 0.3s ease;
      width: 46px;
      text-align: center;
    }

    .sound-label.active { opacity: 1; color: var(--fg-strong); }

    /* Instruction */
    .instruction {
      font-family: var(--body-font);
      font-size: 0.88rem;
      color: var(--fg-muted);
      text-align: center;
      line-height: 1.5;
      max-width: 300px;
    }

    /* Sound history strip */
    .history-strip {
      display: flex;
      gap: var(--space-2);
      align-items: center;
      min-height: 2rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .history-chip {
      font-family: var(--body-font);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--line-soft);
      background: rgba(255,255,255,0.5);
      color: var(--fg-muted);
      animation: chip-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      white-space: nowrap;
    }

    @keyframes chip-in {
      from { opacity: 0; transform: scale(0.7) translateY(4px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Footer */
    .footer {
      text-align: center;
      animation: fx-enter 640ms cubic-bezier(0.22, 1, 0.36, 1) 300ms both;
    }

    .footer p {
      font-size: 0.8rem;
      color: var(--fg-muted);
      opacity: 0.6;
    }

    /* Motion presets */
    @keyframes fx-enter {
      from { opacity: 0; transform: translate3d(0, 18px, 0) scale(0.985); }
      to   { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Mobile */
    @media (max-width: 420px) {
      .cat-btn { width: 136px; height: 136px; }
      .cat-face { font-size: 68px; }
      .cat-button-wrapper { width: 156px; height: 156px; }
      .header h1 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <div class="paw-bg" aria-hidden="true">
    <span>🐾</span><span>🐾</span><span>🐾</span>
    <span>🐾</span><span>🐾</span><span>🐾</span>
    <span>🐾</span><span>🐾</span>
  </div>

  <div class="page-container">

    <header class="header">
      <div class="eyebrow">🎵 Interactive</div>
      <h1>Cat <em>Sounds</em></h1>
      <p>Press the cat — hear what it says</p>
    </header>

    <div class="cat-card" id="catCard">
      <div class="cat-button-wrapper">
        <div class="glow-ring"  id="glowRing1"></div>
        <div class="glow-ring-2" id="glowRing2"></div>
        <button
          class="cat-btn"
          id="catBtn"
          aria-label="Play a random cat sound"
          title="Click to hear a cat sound!"
        >
          <span class="cat-face" id="catFace" aria-hidden="true">😺</span>
        </button>
      </div>

      <div class="sound-display" id="soundDisplay" role="status" aria-live="polite" aria-atomic="true"></div>

      <div class="sound-indicators" role="group" aria-label="Sound selector indicators">
        <div class="indicator-dot" data-sound="1" id="dot1"></div>
        <div class="indicator-dot" data-sound="2" id="dot2"></div>
        <div class="indicator-dot" data-sound="3" id="dot3"></div>
      </div>

      <div class="sound-labels" aria-hidden="true">
        <span class="sound-label" id="lbl1">Meow</span>
        <span class="sound-label" id="lbl2">Purr</span>
        <span class="sound-label" id="lbl3">Chirp</span>
      </div>

      <div class="history-strip" id="historyStrip" aria-label="Recent sounds"></div>

      <p class="instruction">Every tap picks a different cat sound — never the same one twice in a row 🐾</p>
    </div>

    <footer class="footer">
      <p>Made with 🧡 · Three high-quality synthesized cat sounds</p>
    </footer>

  </div>

  <script>
    // ─── Web Audio Engine ────────────────────────────────────────────────────
    const AC = window.AudioContext || window.webkitAudioContext;
    let ctx = null;

    function getCtx() {
      if (!ctx) ctx = new AC();
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    // Sound 1 · Meow
    function playMeow() {
      const c = getCtx(), now = c.currentTime;
      const osc   = c.createOscillator();
      const gain  = c.createGain();
      const filt1 = c.createBiquadFilter();
      const filt2 = c.createBiquadFilter();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(380, now);
      osc.frequency.linearRampToValueAtTime(640, now + 0.14);
      osc.frequency.linearRampToValueAtTime(520, now + 0.38);
      osc.frequency.linearRampToValueAtTime(440, now + 0.62);
      osc.frequency.linearRampToValueAtTime(310, now + 0.88);

      filt1.type = 'bandpass';
      filt1.frequency.setValueAtTime(900, now);
      filt1.frequency.linearRampToValueAtTime(1700, now + 0.18);
      filt1.frequency.linearRampToValueAtTime(1200, now + 0.62);
      filt1.Q.value = 4;

      filt2.type = 'lowpass';
      filt2.frequency.value = 3200;
      filt2.Q.value = 0.8;

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.38, now + 0.06);
      gain.gain.setValueAtTime(0.38, now + 0.52);
      gain.gain.linearRampToValueAtTime(0, now + 0.94);

      osc.connect(filt1); filt1.connect(filt2);
      filt2.connect(gain); gain.connect(c.destination);
      osc.start(now); osc.stop(now + 1.0);
      return { name: 'Meow', emoji: '😺', dot: 1, duration: 1100 };
    }

    // Sound 2 · Purr
    function playPurr() {
      const c = getCtx(), now = c.currentTime, dur = 1.7;
      const lfo    = c.createOscillator();
      const lfoG   = c.createGain();
      const osc    = c.createOscillator();
      const gain   = c.createGain();
      const filt   = c.createBiquadFilter();

      lfo.frequency.value = 27;
      lfoG.gain.value = 0.19;

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(66, now);
      osc.frequency.linearRampToValueAtTime(71, now + dur);

      filt.type = 'lowpass';
      filt.frequency.value = 440;
      filt.Q.value = 1.4;

      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.30, now + 0.18);
      gain.gain.setValueAtTime(0.30, now + dur - 0.32);
      gain.gain.linearRampToValueAtTime(0, now + dur);

      lfo.connect(lfoG); lfoG.connect(gain.gain);
      osc.connect(filt); filt.connect(gain); gain.connect(c.destination);

      lfo.start(now); lfo.stop(now + dur);
      osc.start(now); osc.stop(now + dur);
      return { name: 'Purr', emoji: '😸', dot: 2, duration: 1900 };
    }

    // Sound 3 · Chirp
    function playChirp() {
      const c = getCtx(), now = c.currentTime;
      const notes   = [900, 1060, 930, 1120, 990, 1050];
      const stepDur = 0.088;

      notes.forEach((freq, i) => {
        const osc  = c.createOscillator();
        const gn   = c.createGain();
        const filt = c.createBiquadFilter();

        osc.type = 'triangle';
        osc.frequency.value = freq;
        osc.frequency.linearRampToValueAtTime(freq * 1.06, now + i * stepDur + stepDur);

        filt.type = 'bandpass';
        filt.frequency.value = freq * 1.1;
        filt.Q.value = 4.5;

        const t = now + i * stepDur;
        gn.gain.setValueAtTime(0, t);
        gn.gain.linearRampToValueAtTime(0.29, t + 0.014);
        gn.gain.setValueAtTime(0.27, t + stepDur - 0.018);
        gn.gain.linearRampToValueAtTime(0, t + stepDur);

        osc.connect(filt); filt.connect(gn); gn.connect(c.destination);
        osc.start(t); osc.stop(t + stepDur + 0.01);
      });

      return { name: 'Chirp', emoji: '🙀', dot: 3, duration: 1000 };
    }

    // ─── UI State ────────────────────────────────────────────────────────────
    const sounds  = [playMeow, playPurr, playChirp];
    let lastIdx   = -1;
    let isPlaying = false;
    const MAX_HISTORY = 5;
    const history = [];

    const catBtn      = document.getElementById('catBtn');
    const catFace     = document.getElementById('catFace');
    const soundDisp   = document.getElementById('soundDisplay');
    const catCard     = document.getElementById('catCard');
    const glowRing1   = document.getElementById('glowRing1');
    const glowRing2   = document.getElementById('glowRing2');
    const historyEl   = document.getElementById('historyStrip');
    const dots        = [1,2,3].map(n => document.getElementById('dot'+n));
    const labels      = [1,2,3].map(n => document.getElementById('lbl'+n));

    function clearDots() {
      dots.forEach(d => d.classList.remove('active'));
      labels.forEach(l => l.classList.remove('active'));
    }

    function activateDot(n) {
      clearDots();
      dots[n-1].classList.add('active');
      labels[n-1].classList.add('active');
    }

    function addHistory(name, emoji) {
      history.push({ name, emoji });
      if (history.length > MAX_HISTORY) history.shift();
      renderHistory();
    }

    function renderHistory() {
      historyEl.innerHTML = '';
      history.forEach(item => {
        const chip = document.createElement('span');
        chip.className = 'history-chip';
        chip.textContent = item.emoji + ' ' + item.name;
        historyEl.appendChild(chip);
      });
    }

    function triggerGlow() {
      glowRing1.classList.remove('pulse');
      glowRing2.classList.remove('pulse');
      void glowRing1.offsetWidth; // reflow
      void glowRing2.offsetWidth;
      glowRing1.classList.add('pulse');
      glowRing2.classList.add('pulse');
    }

    function playRandom() {
      if (isPlaying) return;
      isPlaying = true;

      let idx;
      do { idx = Math.floor(Math.random() * sounds.length); }
      while (idx === lastIdx && sounds.length > 1);
      lastIdx = idx;

      const result = sounds[idx]();

      // Face + bounce
      catFace.textContent = result.emoji;
      catBtn.classList.add('bouncing');

      // Glow effects
      triggerGlow();
      catCard.classList.add('active-glow');

      // Sound label
      soundDisp.textContent = result.name + '!';
      soundDisp.classList.add('visible');

      // Dots
      activateDot(result.dot);

      // History
      addHistory(result.name, result.emoji);

      // Reset
      setTimeout(() => {
        catBtn.classList.remove('bouncing');
        catFace.textContent = '😺';
        catCard.classList.remove('active-glow');
        isPlaying = false;
      }, result.duration);

      setTimeout(() => {
        soundDisp.classList.remove('visible');
      }, result.duration - 180);
    }

    // ─── Event Listeners ─────────────────────────────────────────────────────
    catBtn.addEventListener('click', playRandom);

    catBtn.addEventListener('mousedown',  () => catBtn.classList.add('pressing'));
    catBtn.addEventListener('touchstart', () => catBtn.classList.add('pressing'), { passive: true });
    catBtn.addEventListener('mouseup',    () => catBtn.classList.remove('pressing'));
    catBtn.addEventListener('touchend',   () => catBtn.classList.remove('pressing'));
    catBtn.addEventListener('mouseleave', () => catBtn.classList.remove('pressing'));

    // Spacebar / Enter keyboard support
    document.addEventListener('keydown', e => {
      if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        playRandom();
      }
    });
  </script>
</body>
</html>
